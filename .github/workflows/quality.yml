name: Taskflow quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test-storybook
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: taskflow_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TASKFLOW_DATA_ENV: test
      TEST_DATABASE_URL: postgresql://taskflow:ci-only-password@localhost:5432/taskflow_test
      SECRET_KEY: ci-only-secret-key-for-isolated-test-database-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test accounts projects tasks dashboard tests --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_preprod
      - run: python manage.py seed_preprod
      - run: python manage.py check_data_integrity
